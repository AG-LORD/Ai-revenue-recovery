<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Razorpay Test Checkout</title>

    <!-- Razorpay Checkout SDK -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .card {
        background: white;
        width: 350px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
      }

      .price {
        font-size: 32px;
        font-weight: bold;
        margin: 20px 0;
      }

      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #3399cc;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      .test-label {
        margin-top: 15px;
        font-size: 13px;
        color: #777;
      }

      .journey-label {
        margin-top: 8px;
        font-size: 12px;
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>Test Store</h1>

      <p>Premium Shoes</p>

      <div class="price">₹500</div>

      <button id="pay-button" onclick="openCheckout()">Pay ₹500</button>

      <div
        id="status-msg"
        style="margin-top: 10px; font-size: 13px; color: #555; display: none"
      ></div>

      <div class="test-label">LIVE TEST CHECKOUT · Razorpay Test Mode</div>
      <div class="journey-label">
        Server confirmation is required after payment submission.
        Closing checkout means CHECKOUT_ABANDONED, not payment failure.
      </div>
    </div>

    <script>
      let statusPollTimer = null;
      let statusPollAttempts = 0;
      const maxStatusPollAttempts = 10;

      function stopStatusPolling() {
        if (statusPollTimer) {
          clearTimeout(statusPollTimer);
          statusPollTimer = null;
        }
      }

      async function pollPaymentStatus(apiBase, paymentId, btn, statusMsg) {
        if (statusPollAttempts >= maxStatusPollAttempts) {
          statusMsg.innerText =
            "Payment submitted; server confirmation is still pending. Check the dashboard.";
          btn.disabled = false;
          btn.innerText = "Pay ₹500";
          return;
        }

        statusPollAttempts += 1;
        try {
          const response = await fetch(
            `${apiBase}/api/cases/${encodeURIComponent(paymentId)}`,
          );
          if (response.ok) {
            const state = await response.json();
            if (state.payment_lifecycle_status === "captured") {
              statusMsg.innerText = state.recovery_status === "RECOVERED"
                ? `Payment captured and ₹${state.recovered_amount} recovered.`
                : "Payment captured and confirmed by the server.";
              stopStatusPolling();
              btn.disabled = false;
              btn.innerText = "Pay ₹500";
              return;
            }
            if (state.payment_lifecycle_status === "failed") {
              statusMsg.innerText = "Server confirmed that the payment failed.";
              stopStatusPolling();
              btn.disabled = false;
              btn.innerText = "Pay ₹500";
              return;
            }
          }
        } catch (error) {
          console.error("Payment status polling error:", error);
        }

        statusMsg.innerText = "Payment submitted; waiting for server confirmation...";
        statusPollTimer = setTimeout(
          () => pollPaymentStatus(apiBase, paymentId, btn, statusMsg),
          1500,
        );
      }

      async function openCheckout() {
        const btn = document.getElementById("pay-button");
        const statusMsg = document.getElementById("status-msg");

        try {
          btn.disabled = true;
          btn.innerText = "Creating Order...";
          statusMsg.style.display = "block";
          statusMsg.innerText = "Requesting secure order from backend...";

          // Determine API base URL (handles both localhost:8000 and direct file://)
          const apiBase = window.location.origin.includes("http")
            ? window.location.origin
            : "http://localhost:8000";

          const response = await fetch(`${apiBase}/api/create-order`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
          });

          if (!response.ok) {
            throw new Error("Failed to create order on server");
          }

          const order = await response.json();

          statusMsg.innerText = `Order created: ${order.order_id}`;

          var options = {
            key: order.key_id,
            amount: order.amount,
            currency: order.currency,
            name: "AI Revenue Recovery Demo",
            description: "Test Purchase",
            order_id: order.order_id,
            handler: function (response) {
              console.log("Payment successful!", response);
              statusPollAttempts = 0;
              statusMsg.innerText =
                "Payment submitted; waiting for server confirmation...";
              pollPaymentStatus(apiBase, response.razorpay_payment_id, btn, statusMsg);
            },
            modal: {
              ondismiss: function () {
                stopStatusPolling();
                console.log("Checkout modal dismissed: CHECKOUT_ABANDONED");
                btn.disabled = false;
                btn.innerText = "Pay ₹500";
                statusMsg.innerText =
                  "Checkout abandoned: the payment window was closed. No payment failure was recorded.";
              },
            },
            prefill: {
              name: "Test Customer",
              email: "test@example.com",
              contact: "9999999999",
            },
            theme: {
              color: "#3399cc",
            },
          };

          var rzp = new Razorpay(options);
          rzp.open();
        } catch (error) {
          console.error("Error launching checkout:", error);
          alert("Error creating order: " + error.message);
          btn.disabled = false;
          btn.innerText = "Pay ₹500";
          statusMsg.innerText =
            "Error creating order. Make sure backend is running on port 8000.";
        }
      }
    </script>
  </body>
</html>
